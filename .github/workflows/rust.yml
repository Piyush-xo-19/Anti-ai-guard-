name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-fixtures:
    name: Windows fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Validate fixtures and minimized evidence
        shell: pwsh
        run: ./scripts/validate-windows.ps1 -Consent -OutputPath reports/validation/ci-${{ matrix.os }}.json
      - name: Preserve sanitized fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-evidence-${{ matrix.os }}
          path: reports/validation/ci-${{ matrix.os }}.json
          if-no-files-found: error
  shared-contracts-linux:
    name: Shared contracts (Linux; no collector support claim)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo build --locked --offline
      - run: cargo test --locked --offline
      - run: cargo run --locked --offline --example diagnostic
      - run: cargo run --locked --offline --example report_fixture -- --json
      - run: cargo doc --no-deps --locked --offline
